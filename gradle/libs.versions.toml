# Single place for dependency versions. Spring Boot manages most versions through its BOM;
# only libraries the BOM doesn't manage are pinned here.
[versions]
spring-boot = "3.5.16"
spring-dependency-management = "1.1.7"
spring-modulith = "1.4.14"
springdoc = "2.8.17"
mapstruct = "1.6.3"
lombok-mapstruct-binding = "0.2.0"
poi = "5.5.1"
opencsv = "5.12.0"
minio = "8.6.0"
firebase-admin = "9.11.0"
wiremock = "3.13.2"
spotless = "8.10.4"
palantir-java-format = "2.102.0"

[libraries]
spring-modulith-bom = { module = "org.springframework.modulith:spring-modulith-bom", version.ref = "spring-modulith" }
springdoc-openapi = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }
mapstruct = { module = "org.mapstruct:mapstruct", version.ref = "mapstruct" }
mapstruct-processor = { module = "org.mapstruct:mapstruct-processor", version.ref = "mapstruct" }
lombok-mapstruct-binding = { module = "org.projectlombok:lombok-mapstruct-binding", version.ref = "lombok-mapstruct-binding" }
poi-ooxml = { module = "org.apache.poi:poi-ooxml", version.ref = "poi" }
opencsv = { module = "com.opencsv:opencsv", version.ref = "opencsv" }
minio = { module = "io.minio:minio", version.ref = "minio" }
firebase-admin = { module = "com.google.firebase:firebase-admin", version.ref = "firebase-admin" }
wiremock = { module = "org.wiremock:wiremock-standalone", version.ref = "wiremock" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
