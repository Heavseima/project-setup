# Common configuration for all profiles. Every secret or environment-specific value comes from an env var.
# Profile-specific overrides: application-{dev,test,staging,prod}.yml
spring:
  application:
    name: application-logic-service
  profiles:
    default: dev
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # schema is owned by Flyway only
    properties:
      hibernate:
        jdbc.time_zone: UTC
        jdbc.batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI}
          jwk-set-uri: ${JWT_JWK_SET_URI}
          audiences: ${JWT_AUDIENCES:}

  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:50MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:100MB}

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

  modulith:
    events:
      republish-outstanding-events-on-restart: true
      jdbc:
        schema-initialization:
          enabled: false          # table created by Flyway (V001)

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

management:
  health:
    mail:
      enabled: false              # an SMTP outage must not fail k8s probes / restart pods
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,modulith
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  security:
    role-claims:
      - realm_access.roles
    public-paths:
      - /actuator/health/**
      - /actuator/info
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  integration:
    rda:
      base-url: ${RDA_API_URL}
      api-key: ${RDA_API_KEY}
    assessment:
      base-url: ${ASSESSMENT_API_URL}
      api-key: ${ASSESSMENT_API_KEY}
  storage:
    minio:
      endpoint: ${MINIO_ENDPOINT}
      access-key: ${MINIO_ACCESS_KEY}
      secret-key: ${MINIO_SECRET_KEY}
      bucket: ${MINIO_BUCKET:hrd-documents}
  firebase:
    credentials-path: ${FCM_CREDENTIALS_PATH:}
